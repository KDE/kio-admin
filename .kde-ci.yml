Dependencies:
- 'on': ['Linux/Qt5']
  'require':
    'frameworks/extra-cmake-modules': '@latest'
    'frameworks/kio': '@latest'
    'libraries/polkit-qt-1': '@latest'

- 'on': ['Linux/Qt6', 'Linux/Qt6Next']
  'require':
    'frameworks/extra-cmake-modules': 'Frameworks/6.24'
    'frameworks/kio': 'Frameworks/6.24'
    'libraries/polkit-qt-1': 'v0.200.0'

Options:
  require-passing-tests-on: ['@all']
